name: Stream Director tests

on:
  push:
    branches:
      - feature/stream-director-2026
  pull_request:
    branches:
      - jarvis-2.0-development

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-control.txt -r requirements-stream.txt
      - name: Compile JARVIS modules
        run: python -m compileall -q jarvis_control
      - name: Stream Director unit tests
        run: python -m unittest -v jarvis_control.tests.test_stream_director
      - name: Existing JARVIS tests
        run: python -m unittest discover -s jarvis_control/tests -p "test_*.py"
